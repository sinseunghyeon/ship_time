<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm UI</title>
<style>
  :root{--bg:#0A1824;--card:#12304D;--cream:#FFF6E9;--sub:#9FB9D4;--gold:#FFC24B;--navbar:#0E2135;--line:rgba(255,255,255,.07)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 0%,#153a5e,#0a1824 70%);
    font-family:-apple-system,"Segoe UI",Roboto,"Pretendard","Noto Sans KR",sans-serif;color:var(--cream)}
  .hint{color:var(--sub);font-size:12.5px;text-align:center;margin-bottom:12px}
  .phone{width:360px;max-width:100%;background:#07131f;border-radius:34px;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .screen{background:var(--bg);border-radius:26px;overflow:hidden;min-height:600px;display:flex;flex-direction:column}

  /* 상단 헤더 */
  header{padding:22px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between}
  .title{display:flex;align-items:center;gap:8px}
  .title h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
  .anchor{color:var(--gold);font-size:18px}
  .sub{color:var(--sub);font-size:12px;margin-top:2px;font-weight:500}
  .refresh{color:var(--sub);font-size:20px;opacity:.9;margin-top:4px}

  .body{flex:1;padding:4px 16px 16px;overflow:auto}
  .card{background:var(--card);border-radius:22px;padding:18px 20px;margin-bottom:12px}
  .clabel{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:11px;font-weight:700;letter-spacing:1.4px}
  .pick{color:var(--cream);font-size:15px;font-weight:700}
  .big{font-size:50px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .meta{color:var(--sub);font-size:12px;margin-top:2px}
  .btns{display:flex;gap:12px;margin-top:16px}
  .btn{flex:1;background:linear-gradient(180deg,#1F4A6E,#163A58);border:0;border-radius:18px;color:var(--cream);
    font-weight:800;font-size:18px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .btn small{color:var(--sub);font-size:11px;font-weight:600}
  .status{display:flex;align-items:center;gap:8px;margin-top:14px;color:#5FD38D;font-size:13px}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#5FD38D}

  /* 하단 탭 */
  nav{background:var(--navbar);display:flex;justify-content:space-around;padding:8px 6px 10px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--sub);font-size:12px;font-weight:500}
  .tab .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:16px}
  .tab.on{color:var(--gold);font-weight:700}
  .tab.on .pill{background:rgba(255,194,75,.20)}
  .tab svg{width:22px;height:22px}
</style>
</head>
<body>
  <div style="width:360px;max-width:100%">
    <p class="hint">Helm · 새 상단 헤더 + 골드 포인트 하단 탭</p>
    <div class="phone"><div class="screen">
      <header>
        <div>
          <div class="title"><h1>Helm</h1><span class="anchor">⚓</span></div>
          <div class="sub" id="sub">UTC · —</div>
        </div>
        <div class="refresh">⟳</div>
      </header>

      <div class="body">
        <div class="card">
          <div class="clabel"><span>SHIP TIME</span><span class="pick">UTC+9 ▾</span></div>
          <div class="big" id="ship">12:00:00</div>
          <div class="meta" id="meta">UTC 03:00 · 기기 시계 12:00 (Etc/GMT-9)</div>
          <div class="btns">
            <button class="btn">−1h<small>늦추기</small></button>
            <button class="btn">+1h<small>당기기</small></button>
          </div>
          <div class="status"><span class="dot"></span>기기 시계가 선박 시간과 일치합니다</div>
        </div>
        <div class="card" style="color:var(--sub);font-size:13px">기기 시간대도 같이 변경 · 지금 다시 적용 · 맞추기</div>
      </div>

      <nav>
        <div class="tab on">
          <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>시간
        </div>
        <div class="tab">
          <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#0E2135"/><circle cx="15" cy="17" r="2" fill="#0E2135"/></svg></span>설정
        </div>
        <div class="tab">
          <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>기록
        </div>
      </nav>
    </div></div>
  </div>
<script>
  const two=n=>String(n).padStart(2,'0');
  const wd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick(){
    const u=new Date(), sh=(u.getUTCHours()+9)%24;
    document.getElementById('ship').textContent=`${two(sh)}:${two(u.getUTCMinutes())}:${two(u.getUTCSeconds())}`;
    document.getElementById('meta').textContent=`UTC ${two(u.getUTCHours())}:${two(u.getUTCMinutes())} · 기기 시계 ${two(sh)}:${two(u.getUTCMinutes())} (Etc/GMT-9)`;
    document.getElementById('sub').textContent=`UTC · ${wd[(u.getUTCDay()+6)%7]}, ${mo[u.getUTCMonth()]} ${u.getUTCDate()}`;
  }
  tick();setInterval(tick,1000);
</script>
</body>
</html>
